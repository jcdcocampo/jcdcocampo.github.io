<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />
  <link rel="apple-touch-icon" href="assets/favicon.jpg" />
  <title>Error 404 — Engr. Jose Carlo David Ocampo</title>
  <meta name="description" content="Page not found. Jump the cacti and make your way back." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#f2f2f7" />

  <!-- Match the site: apply saved light/dark preference before paint -->
  <script>
    (function(){
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e){}
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sf: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
            'Helvetica Neue', Arial, sans-serif;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text-primary: #1c1c1e;
      --text-secondary: #636366;
      --accent: #007aff;
      --shadow: 0 12px 40px rgba(0,0,0,0.12);
      --btn-ghost-bg: #f0f0f5;
      --btn-ghost-hover: #e6e6ee;
      /* game — pure two-tone, swaps with theme like the original dino game's day/night */
      --game-bg: #ffffff;
      --game-ink: #1c1c1e;
    }
    [data-theme="dark"] {
      --bg: #000000;
      --card: #1c1c1e;
      --text-primary: #ffffff;
      --text-secondary: #aeaeb2;
      --shadow: 0 16px 50px rgba(0,0,0,0.6);
      --btn-ghost-bg: #2c2c2e;
      --btn-ghost-hover: #3a3a3c;
      --game-bg: #1c1c1e;
      --game-ink: #f2f2f2;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--sf);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background .3s ease, color .3s ease;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 32px 28px;
      text-align: center;
      transition: background .3s ease;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(52px, 12vw, 92px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 10px;
    }
    .lead {
      font-size: clamp(15px, 2.4vw, 17px);
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }

    /* ── Game shell ── */
    .game-shell {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--game-bg);
      box-shadow: inset 0 0 0 1px rgba(128,128,128,0.25);
      aspect-ratio: 168 / 46;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background .3s ease;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    .hud {
      position: absolute;
      top: 6px; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
      font-family: 'Courier New', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--game-ink);
      opacity: 0.75;
      pointer-events: none;
    }
    .hud .hi { opacity: 0.6; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      color: var(--game-ink);
      padding: 12px;
      transition: opacity .2s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay .big { font-size: clamp(15px, 3vw, 19px); font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 0.5px; }
    .overlay .small { font-size: 12px; opacity: 0.7; max-width: 380px; line-height: 1.4; }
    .overlay kbd {
      font-family: inherit;
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 0 6px;
      font-size: 11px;
    }
    .controls-line { margin-top: 2px; font-size: 11.5px; opacity: 0.6; }

    /* ── Buttons ── */
    .btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(0,122,255,0.28); }
    .btn-primary:hover { box-shadow: 0 8px 24px rgba(0,122,255,0.38); }
    .btn-ghost { background: var(--btn-ghost-bg); color: var(--text-primary); }
    .btn-ghost:hover { background: var(--btn-ghost-hover); }
    .btn svg { width: 17px; height: 17px; }

    @media (max-width: 560px) {
      .wrap { padding: 24px 16px 20px; border-radius: 20px; }
      .controls-line .desktop-only { display: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Error 404</div>
    <h1>404</h1>
    <p class="lead">This page doesn't exist. Jump the cacti and make your way back.</p>

    <div class="game-shell" id="shell" aria-label="Mini pixel runner — a horse jumping cacti. Press space or tap to jump.">
      <canvas id="game" width="168" height="46"></canvas>
      <div class="hud">
        <span id="score">000</span>
        <span class="hi">HI <span id="hi">000</span></span>
      </div>
      <div class="overlay" id="overlay">
        <div class="big" id="ovTitle">JUMP TO START</div>
        <div class="small" id="ovText">Clear the cacti.</div>
        <div class="controls-line">
          <span class="desktop-only"><kbd>Space</kbd> / <kbd>&uarr;</kbd> jump &nbsp;·&nbsp; </span>
          <span>tap to jump</span>
        </div>
      </div>
    </div>

    <div class="btns">
      <a class="btn btn-primary" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
      </a>
      <button class="btn btn-ghost" id="restart" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Restart run
      </button>
    </div>
  </main>

  <script>
  (function () {
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Tiny native resolution, scaled up with `image-rendering: pixelated`
    // — the same trick that makes the actual Chrome dino game read as
    // pixel art. Flat two-tone fills only, no gradients, no images.
    var W = 168, H = 46;
    var GROUND = 36;

    function ink() {
      return getComputedStyle(document.documentElement).getPropertyValue('--game-ink').trim() || '#1c1c1e';
    }
    function bg() {
      return getComputedStyle(document.documentElement).getPropertyValue('--game-bg').trim() || '#ffffff';
    }

    // ---- State ----
    var STATE = 'ready';                 // ready | running | over
    var score = 0, best = 0;
    try { best = parseInt(localStorage.getItem('sw404_best') || '0', 10) || 0; } catch (e) {}
    var speed = 62, baseSpeed = 62, spawnT = 0, nextGap = 55, elapsed = 0;

    var scoreEl = document.getElementById('score');
    var hiEl = document.getElementById('hi');
    var overlay = document.getElementById('overlay');
    var ovTitle = document.getElementById('ovTitle');
    var ovText = document.getElementById('ovText');
    function pad3(n) { n = Math.floor(n); return (n < 10 ? '00' : n < 100 ? '0' : '') + n; }
    hiEl.textContent = pad3(best);

    // ---- Player: a horse, side-on, simple two-frame gallop ----
    var horse = { x: 16, y: GROUND, vy: 0, w: 17, h: 12 };
    var GRAV = 700, JUMP = -165;
    var legPhase = 0;

    // ---- Obstacles: cacti — a single stem, or a stem with one or two
    // side arms, at a couple of widths, exactly like the real game's
    // obstacle variety ----
    var obs = [];
    function spawnCactus() {
      var kind = Math.random();
      var h = kind < 0.34 ? 8 : kind < 0.7 ? 11 : 13;
      var arms = kind < 0.34 ? 0 : kind < 0.7 ? 1 : 2;
      obs.push({ x: W + 4, y: GROUND, w: 6, h: h, arms: arms });
    }
    function spawn() {
      spawnCactus();
      // occasional close cluster, once the run has warmed up
      if (score > 45 && Math.random() < 0.24) {
        obs.push({ x: W + 4 + 12, y: GROUND, w: 5, h: 7, arms: 0 });
      }
    }

    // ---- A few slow drifting clouds — fixed shape, simple horizontal
    // drift, no per-frame recompute beyond an x position ----
    var clouds = [
      { x: 30, y: 8, w: 14 },
      { x: 95, y: 14, w: 10 },
      { x: 150, y: 6, w: 12 }
    ];

    // ---- Audio: tiny synthesized blips, no audio files ----
    var AC = null, muted = false;
    try { muted = localStorage.getItem('sw404_mute') === '1'; } catch (e) {}
    function beep(freq, dur) {
      if (muted) return;
      try {
        if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = 'square';
        o.frequency.value = freq;
        g.gain.value = 0.035;
        o.connect(g); g.connect(AC.destination);
        var t = AC.currentTime;
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.08));
        o.start(t); o.stop(t + (dur || 0.08));
      } catch (e) {}
    }

    // ---- Input: single action — jump ----
    function jump() {
      if (STATE === 'ready') { start(); return; }
      if (STATE === 'over') { reset(); return; }
      if (horse.y >= GROUND - 0.5) { horse.vy = JUMP; beep(520, 0.07); }
    }
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    });
    var shell = document.getElementById('shell');
    shell.addEventListener('touchstart', function (e) { e.preventDefault(); jump(); }, { passive: false });
    shell.addEventListener('mousedown', function () { jump(); });
    document.getElementById('restart').addEventListener('click', function () { reset(); });

    // ---- Lifecycle ----
    function start() { STATE = 'running'; overlay.classList.add('hidden'); }
    function reset() {
      obs.length = 0; score = 0; speed = baseSpeed; spawnT = 0; nextGap = 55;
      elapsed = 0; horse.y = GROUND; horse.vy = 0;
      STATE = 'running';
      overlay.classList.add('hidden');
    }
    function gameOver() {
      STATE = 'over';
      beep(140, 0.18);
      var finalScore = Math.floor(score);
      if (finalScore > best) {
        best = finalScore;
        try { localStorage.setItem('sw404_best', String(best)); } catch (e) {}
        hiEl.textContent = pad3(best);
        ovTitle.textContent = 'NEW BEST: ' + pad3(finalScore);
      } else {
        ovTitle.textContent = 'STUMBLED — ' + pad3(finalScore);
      }
      ovText.textContent = 'Run it back?';
      overlay.querySelector('.controls-line').innerHTML =
        '<span class="desktop-only"><kbd>Space</kbd> to retry &nbsp;·&nbsp; </span><span>tap to retry</span>';
      overlay.classList.remove('hidden');
    }

    function hit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // ---- Update ----
    var last = performance.now();
    function update(dt) {
      elapsed += dt;
      speed = baseSpeed + Math.min(70, elapsed * 5.5);

      horse.vy += GRAV * dt;
      horse.y += horse.vy * dt;
      if (horse.y > GROUND) { horse.y = GROUND; horse.vy = 0; }

      // leg-gallop cycle only advances while grounded
      if (horse.y >= GROUND - 0.5) legPhase += dt * speed * 0.35;

      spawnT += speed * dt;
      if (spawnT >= nextGap) {
        spawnT = 0;
        nextGap = 42 + Math.random() * 30 - Math.min(14, elapsed * 0.6);
        spawn();
      }

      for (var i = obs.length - 1; i >= 0; i--) {
        var o = obs[i];
        o.x -= speed * dt;
        var box = { x: o.x, y: o.y - o.h, w: o.w, h: o.h };
        var horseBox = { x: horse.x + 2, y: horse.y - horse.h + 2, w: horse.w - 5, h: horse.h - 3 };
        if (hit(horseBox, box)) { gameOver(); return; }
        if (o.x + o.w < 0) obs.splice(i, 1);
      }

      for (var c = 0; c < clouds.length; c++) {
        clouds[c].x -= speed * dt * 0.2;
        if (clouds[c].x + clouds[c].w < 0) clouds[c].x = W + Math.random() * 20;
      }

      score += speed * dt * 0.28;
      scoreEl.textContent = pad3(score);
    }

    // ---- Draw: flat two-tone only ----
    function drawHorse(fill) {
      var x = Math.round(horse.x), y = Math.round(horse.y - horse.h);
      var legUp = Math.floor(legPhase) % 2 === 0;
      var grounded = horse.y >= GROUND - 0.5;
      ctx.fillStyle = fill;

      // body
      ctx.fillRect(x + 3, y + 4, 10, 4);
      // neck + head, angled up-right
      ctx.fillRect(x + 11, y + 2, 3, 3);
      ctx.fillRect(x + 13, y, 3, 3);
      // ear
      ctx.fillRect(x + 14, y - 1, 1, 1);
      // mane
      ctx.fillRect(x + 11, y + 1, 1, 2);
      ctx.fillRect(x + 12, y, 1, 1);
      // tail
      ctx.fillRect(x, y + 3, 2, 1);
      ctx.fillRect(x, y + 5, 1, 2);

      // legs — while airborne, both pairs tuck into a single jump pose;
      // while grounded, front/back pairs alternate for a simple 2-frame gallop
      if (!grounded) {
        ctx.fillRect(x + 4, y + 8, 2, 3);
        ctx.fillRect(x + 10, y + 8, 2, 3);
      } else if (legUp) {
        ctx.fillRect(x + 4, y + 8, 2, 4);
        ctx.fillRect(x + 11, y + 8, 2, 3);
      } else {
        ctx.fillRect(x + 3, y + 8, 2, 3);
        ctx.fillRect(x + 10, y + 8, 2, 4);
      }
    }

    function drawCactus(o, fill) {
      var x = Math.round(o.x), y = Math.round(o.y - o.h);
      ctx.fillStyle = fill;
      // stem
      ctx.fillRect(x + 2, y, 2, o.h);
      if (o.arms >= 1) {
        // right arm
        ctx.fillRect(x + 4, y + 3, 2, 1);
        ctx.fillRect(x + 5, y + 1, 1, 3);
      }
      if (o.arms >= 2) {
        // left arm
        ctx.fillRect(x, y + 5, 2, 1);
        ctx.fillRect(x, y + 3, 1, 3);
      }
    }

    function drawCloud(c, fill) {
      var x = Math.round(c.x), y = Math.round(c.y), w = c.w;
      ctx.fillStyle = fill;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(x, y, w, 2);
      ctx.fillRect(x + Math.round(w * 0.25), y - 1, Math.round(w * 0.5), 1);
      ctx.globalAlpha = 1;
    }

    function draw() {
      var GAME_INK = ink(), GAME_BG = bg();

      ctx.fillStyle = GAME_BG;
      ctx.fillRect(0, 0, W, H);

      for (var c = 0; c < clouds.length; c++) drawCloud(clouds[c], GAME_INK);

      // ground line + scrolling dash ticks
      ctx.fillStyle = GAME_INK;
      ctx.fillRect(0, GROUND, W, 1);
      var dashSpace = 8, dashLen = 3;
      var off = Math.floor((elapsed * speed) % dashSpace);
      for (var dx = -dashSpace + off; dx < W; dx += dashSpace) {
        ctx.fillRect(dx, GROUND + 2, dashLen, 1);
      }

      for (var j = 0; j < obs.length; j++) drawCactus(obs[j], GAME_INK);
      drawHorse(GAME_INK);
    }

    // ---- Loop ----
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (STATE === 'running') update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
